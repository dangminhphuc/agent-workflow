# Manifest trung lập của quy trình — NGUỒN SỰ THẬT DUY NHẤT.
#
# Adapter đọc file này + workflow/phases/*.md rồi biên dịch ra artifact riêng
# của từng agent. Không sửa trực tiếp file được sinh ra trong target repo (chúng bị
# exclude và được sinh lại bởi aw adapter build).
#
# Quy ước ngôn ngữ: định danh (khoá, id, đường dẫn) tiếng Anh ASCII. Nội dung agent
# đọc lúc chạy (thân phase, rules, checkers, lời dặn adapter sinh) tiếng Anh cho gọn
# ngữ cảnh; nội dung người đọc (name/summary, mẫu artifact, output của aw) tiếng Việt.

version: 1
name: Quy trình phát triển phần mềm dựa trên AI agent
language: vi

# Thư mục chứa artifact bàn giao TRONG REPO ĐÍCH (không phải repo này).
# Đây là cơ chế duy nhất làm nên tính không-phụ-thuộc-agent: phase N đọc file
# do phase N-1 ghi ra, và agent nào cũng đọc/ghi được file.
# Artifact của từng feature nằm ở <artifact_dir>/<tên-branch>/ (xem
# conventions.md của target repo): aw check ĐẠT thì commit vào branch của việc,
# aw ship create gỡ khỏi branch trước khi tạo MR — không vào nhánh đích.
# Phải khớp TM_VIEC (tools/lib/md.sh).
artifact_dir: docs/sdlc

# Thư mục cục bộ của engine trong repo đích (bị .git/info/exclude): .engine/
# (rules, templates, checkers chép từ engine), dấu build adapter. Khớp TM_CU.
local_dir: .agent-workflow

# Utility command — không phải phase, không có điều kiện ra riêng. Adapter sinh
# mỗi mục thành một lệnh (Claude Code: /<id>).
#   import          đưa artifact làm bằng tool khác vào giữa quy trình — chỉ sắp
#                   xếp lại theo mẫu, không thêm nội dung
#   approvals       liệt kê mọi ô "Approved by human" chờ người (worktree này, hoặc
#                   --global), dẫn người duyệt từng mục; người chọn Duyệt thì máy tick
#   clarify         gom mọi việc chờ người quyết (open question, phát hiện của checker
#                   LLM) theo thứ tự phải chốt trước, dẫn người đi từng mục
#   bootstrap       một lần cho mỗi target repo: đưa kiến thức (điểm vào, lệnh kiểm,
#                   tài liệu module, ADR có sẵn) vào git — phiên agent mới không phải đoán
#   refactor        review + phản biện từng yêu cầu refactor của người, rồi ghi vào
#                   refactor-requests.md (nguyên văn + tóm tắt, chưa làm); xong thì chỉ lệnh intake
commands:
  - id: import
    file: workflow/import.md
  - id: clarify
    file: workflow/clarify.md
  - id: bootstrap
    file: workflow/bootstrap.md
  - id: refactor
    file: workflow/refactor.md
  - id: approvals
    file: workflow/approvals.md

phases:
  - id: intake
    file: workflow/phases/00-intake.md
    required: true
  - id: spec
    file: workflow/phases/01-spec.md
    required: true
  - id: design
    file: workflow/phases/02-design.md
    required: true
  - id: plan
    file: workflow/phases/03-plan.md
    required: true
  - id: implement
    file: workflow/phases/04-implement.md
    required: true
  - id: review
    file: workflow/phases/05-review.md
    required: true
  - id: ship
    file: workflow/phases/06-ship.md
    required: false
    when: the job passed /aw-review and needs an MR/PR (create it, follow until merged, clean up the worktree)

# Engine là một implementation của interface SDLC (sdlc/stages/*.md, sdlc/invariants.md).
# Phase khai stage nó implement bằng `implements:` trong frontmatter. Ở đây chỉ khai stage
# KHÔNG implement đủ: partial (làm một phần) hoặc gap (không làm) — note bắt buộc, nói phần
# thiếu. Stage không có mặt ở đây = implemented. Utility command không ánh xạ vào stage.
# tools/check-sdlc.sh kiểm khối này cùng frontmatter phase (docs/kien-truc.md § Interface SDLC).
sdlc:
  - stage: plan
    status: partial
    note: Chỉ nhận việc đã có (ticket, tài liệu, lời người); không lập roadmap, ước lượng hay ưu tiên giữa các việc
  - stage: verify
    status: partial
    note: Review độc lập đối chiếu diff với spec, thiết kế, kế hoạch và bằng chứng test/quét máy ghi; không có e2e, kiểm tải hay UAT
  - stage: deploy
    status: partial
    note: Dừng ở MR/PR đã merge; không release, tag, triển khai hay rollback
  - stage: operate
    status: gap
    note: CI/CD và observability nằm ngoài engine; sự cố chưa quay lại thành việc mới

rules:
  - workflow/rules/general.md
  - workflow/rules/source-tracing.md
  - workflow/rules/terms.md

adapters:
  - id: claude-code
    dir: adapters/claude-code
    status: active
  - id: codex
    dir: adapters/codex
    status: planned
  - id: cursor
    dir: adapters/cursor
    status: active
  - id: copilot
    dir: adapters/copilot
    status: planned
