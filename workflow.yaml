# Manifest trung lập của quy trình — NGUỒN SỰ THẬT DUY NHẤT.
#
# Adapter đọc file này + workflow/phases/*.md rồi biên dịch ra artifact riêng
# của từng agent. Không sửa trực tiếp file được sinh ra trong repo đích (chúng bị
# exclude và được sinh lại bởi aw adapter build).
#
# Quy ước: định danh (khoá, id, đường dẫn) dùng tiếng Anh ASCII cho an toàn
# tooling; mọi nội dung người và agent đọc đều bằng tiếng Việt.

version: 1
name: Quy trình phát triển phần mềm dựa trên AI agent
language: vi

# Thư mục chứa artifact bàn giao TRONG REPO ĐÍCH (không phải repo này).
# Đây là cơ chế duy nhất làm nên tính không-phụ-thuộc-agent: phase N đọc file
# do phase N-1 ghi ra, và agent nào cũng đọc/ghi được file.
# Artifact của từng feature nằm ở <artifact_dir>/<tên-branch>/ (xem
# conventions.md của repo đích). Cả thư mục bị .git/info/exclude (aw init):
# artifact chỉ ở máy, không vào commit.
artifact_dir: .agent-workflow

# Lệnh tiện ích — không phải phase, không có điều kiện ra riêng. Adapter sinh
# mỗi mục thành một lệnh (Claude Code: /<id>).
#   import          đưa artifact làm bằng tool khác vào giữa quy trình — chỉ sắp
#                   xếp lại theo mẫu, không thêm nội dung
#   clarify         gom mọi việc chờ người quyết (điểm mù, phát hiện của checker
#                   LLM) theo thứ tự phải chốt trước, dẫn người đi từng mục
commands:
  - id: import
    file: workflow/import.md
  - id: clarify
    file: workflow/clarify.md

phases:
  - id: intake
    file: workflow/phases/00-intake.md
    required: true
  - id: spec
    file: workflow/phases/01-spec.md
    required: true
  - id: design
    file: workflow/phases/02-design.md
    required: true
  - id: plan
    file: workflow/phases/03-plan.md
    required: true
  - id: implement
    file: workflow/phases/04-implement.md
    required: true
  - id: review
    file: workflow/phases/05-review.md
    required: true
  - id: ship
    file: workflow/phases/06-ship.md
    required: false
    when: repo đích có hạ tầng phát hành muốn đưa vào quy trình

rules:
  - workflow/rules/nguyen-tac-chung.md
  - workflow/rules/truy-vet-nguon.md

adapters:
  - id: claude-code
    dir: adapters/claude-code
    status: active
  - id: codex
    dir: adapters/codex
    status: planned
  - id: cursor
    dir: adapters/cursor
    status: active
  - id: copilot
    dir: adapters/copilot
    status: planned
