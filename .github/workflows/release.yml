# Phát hành engine khi push tag YYYY.M.D.
#
# Gắn vào GitHub Release: agent-workflow-YYYY.M.D.tar.gz, aw (wrapper), SHA256SUMS.
# Wrapper `aw` tải đúng các file này (mặc định từ releases/download/YYYY.M.D/).
# Tarball tự sinh của GitHub (archive/refs/tags/...) KHÔNG dùng: GitHub không
# hứa giữ nguyên byte của nó, checksum đã ghim có thể lệch.
name: release

on:
  push:
    # Tag = ngày phát hành YYYY.M.D, không có tiền tố "v"
    # (lọc thô ở đây; luật đầy đủ: tools/lib/version.sh, kiểm khi đóng gói)
    tags: ['[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag khớp VERSION
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME lệch VERSION ($v)"; exit 1; }

      - name: Test
        run: sh tools/chay-thu.sh

      - name: Đóng gói
        run: sh tools/dong-goi.sh dist "$GITHUB_REF_NAME"

      - name: Ghi chú phát hành từ CHANGELOG.md
        run: |
          v=$GITHUB_REF_NAME
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist-notes.md
          [ -s dist-notes.md ] || { echo "CHANGELOG.md thiếu mục [$v]"; exit 1; }

      # Tag có thể đến từ hai đường:
      #   - git push tag            → chưa có release: tạo mới, ghi chú lấy từ CHANGELOG.md
      #   - giao diện GitHub (Releases → Draft a new release → tag mới) → release
      #     đã có: chỉ gắn file vào; ghi chú chỉ điền khi người để trống
      - name: Tạo release hoặc gắn file vào release đã có
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            body=$(gh release view "$tag" --json body --jq .body)
            [ -n "$body" ] || gh release edit "$tag" --notes-file dist-notes.md
          else
            gh release create "$tag" dist/* --title "$tag" --notes-file dist-notes.md
          fi
